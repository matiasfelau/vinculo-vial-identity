name: Docker Release

# Dispara en cada push a main (etiqueta `latest` + `sha-<corto>`) y en cada tag
# de versión `vX.Y.Z` (suma la etiqueta semántica). El job de build nunca corre
# si el de test falla: no hay build de imagen, y mucho menos push, sobre un
# commit con la suite en rojo.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

# Solo lectura salvo lo que build-and-push necesita para autenticar contra
# Docker Hub (vía secrets, no vía permisos de GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...
      - run: go test -count=1 ./...

  build-and-push:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Deriva las etiquetas del evento que disparó el workflow: `latest` +
      # `sha-<corto>` siempre que se publique desde main, y la etiqueta semver
      # cuando el disparador es un tag `vX.Y.Z`. No hay versión hardcodeada acá
      # para no tener que recordar actualizar este archivo en cada release.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: felaufernandezbottaro/vinculo-vial-identity
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache entre corridas sobre las capas de Docker Hub del propio
          # repositorio: la etapa de compilación de Go es la más lenta del
          # Dockerfile y rara vez cambia go.mod/go.sum entre releases.
          cache-from: type=registry,ref=felaufernandezbottaro/vinculo-vial-identity:buildcache
          cache-to: type=registry,ref=felaufernandezbottaro/vinculo-vial-identity:buildcache,mode=max
