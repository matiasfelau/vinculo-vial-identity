# Entorno local de vinculo-vial-identity.
#
# Nomenclatura: este archivo cumple la convención de infraestructura de la
# plataforma, que fija nombres deterministas para contenedores, redes y
# volúmenes. El objetivo es que la resolución DNS entre microservicios no
# dependa del directorio donde cada quien haya clonado el repositorio: por
# defecto Compose deriva el nombre del proyecto de la carpeta contenedora y lo
# antepone a cada recurso, con lo que un mismo componente cambia de nombre según
# la máquina. Por eso el proyecto se nombra de forma explícita y los recursos
# fijan su `name`.
#
# Solo el microservicio y su base. RabbitMQ es un recurso global de la
# plataforma y no se levanta acá: en local el servicio corre con
# RABBITMQ_ENABLED=false y usa el publisher inerte, que deja constancia en el
# log de cada evento que se habría publicado.

name: vinculo-vial-identity

services:
  identity-db:
    image: postgres:17-alpine
    # Base exclusiva de este microservicio: se nombra por el servicio que sirve,
    # no por la tecnología, para que dos componentes con Postgres propio no
    # compitan por el mismo nombre en el daemon.
    container_name: vinculo-vial-identity-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - vinculo-vial-identity-data:/var/lib/postgresql/data
    # El puerto se publica solo en loopback: la base de desarrollo no tiene por
    # qué quedar expuesta en la red donde esté la máquina.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      # Únicamente la red interna. La base no se asoma a `vinculo-vial`: esa red
      # es para tráfico entre componentes de la plataforma, y ningún componente
      # ajeno tiene por qué alcanzar la base de otro.
      - identity-internal

  vinculo-vial-identity:
    build:
      context: .
    # Nombre canónico del componente en toda la plataforma. Fijarlo hace que el
    # contenedor sea alcanzable por DNS con el mismo nombre en cualquier entorno,
    # en vez del `<proyecto>-<servicio>-<n>` que Compose genera por defecto.
    container_name: vinculo-vial-identity
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # El host de la base lo fija la red de Compose y pisa lo que diga el .env,
      # que está pensado para correr el servicio fuera del contenedor.
      POSTGRES_HOST: vinculo-vial-identity-db
      POSTGRES_PORT: 5432
      # Dentro de la red de Compose el tráfico no sale del host. Fuera de acá,
      # la configuración rechaza sslmode=disable con APP_ENV=production.
      POSTGRES_SSLMODE: disable
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    # Deliberadamente sin publicar HTTP_INTERNAL_PORT: las rutas /internal/*
    # (US-04) no se exponen fuera de la red interna. Vehicle las alcanza igual
    # dentro de la red `vinculo-vial`, sin necesidad de un `ports:` acá. El
    # secreto INTERNAL_SERVICE_TOKEN es la segunda capa de esa protección.
    depends_on:
      identity-db:
        condition: service_healthy
    networks:
      # Red privada del componente, donde vive su base.
      - identity-internal
      # Red compartida de la plataforma: acá lo alcanzan el Gateway y Vehicle.
      # La clave del servicio es el nombre completo y no `identity` a secas
      # porque Compose publica la clave del servicio como alias DNS, y en una red
      # con varios componentes ese nombre es demasiado genérico y colisiona fácil.
      - vinculo-vial
    # La imagen es scratch: no hay shell ni curl con que ejecutar un healthcheck
    # de Compose. El endpoint /ready existe igual y es el que consume el
    # orquestador en los entornos reales.

volumes:
  vinculo-vial-identity-data:
    # `name` explícito para que el volumen no herede el prefijo del proyecto y
    # quede exactamente con el nombre que fija la convención.
    name: vinculo-vial-identity-data

networks:
  identity-internal:
    # Red privada del componente: aísla el tráfico contra la base, que no tiene
    # por qué atravesar la red compartida de la plataforma.
    name: identity-internal
  # Red compartida de la plataforma. La crea el compose del Gateway, así que hay
  # que levantarlo primero (o crearla a mano: docker network create vinculo-vial).
  vinculo-vial:
    external: true
