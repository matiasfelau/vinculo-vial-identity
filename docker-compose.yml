# Entorno local de vinculo-vial-identity.
#
# Solo el microservicio y su base. RabbitMQ es un recurso global de la
# plataforma y no se levanta acá: en local el servicio corre con
# RABBITMQ_ENABLED=false y usa el publisher inerte, que deja constancia en el
# log de cada evento que se habría publicado.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # El puerto se publica solo en loopback: la base de desarrollo no tiene por
    # qué quedar expuesta en la red donde esté la máquina.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Sin `networks`: se queda en la red por defecto del proyecto, junto con
    # identity. No se une a `vinculo-vial` — esa red es para tráfico entre
    # componentes de la plataforma, no para la base de datos de nadie.

  identity:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # El host de la base lo fija la red de Compose y pisa lo que diga el .env,
      # que está pensado para correr el servicio fuera del contenedor.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # Dentro de la red de Compose el tráfico no sale del host. Fuera de acá,
      # la configuración rechaza sslmode=disable con APP_ENV=production.
      POSTGRES_SSLMODE: disable
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      # Su propia red, donde vive postgres. Declarar `networks` reemplaza la
      # pertenencia implícita a `default`, así que hay que listarla a mano o el
      # servicio pierde acceso a la base.
      default:
      # Red compartida de la plataforma: acá lo alcanza el Gateway. El alias es
      # explícito y no `identity` a secas porque en una red con tres
      # componentes ese nombre es demasiado genérico y colisiona fácil — cada
      # componente se anuncia con su nombre completo.
      vinculo-vial:
        aliases:
          - vinculo-vial-identity
    # La imagen es scratch: no hay shell ni curl con que ejecutar un healthcheck
    # de Compose. El endpoint /readyz existe igual y es el que consume el
    # orquestador en los entornos reales.

volumes:
  postgres-data:

networks:
  # Red compartida de la plataforma. La crea el compose del Gateway, así que
  # hay que levantarlo primero (o crearla a mano: docker network create
  # vinculo-vial). No se declara `default` acá: Compose la crea sola para el
  # proyecto, y postgres vive únicamente en esa red implícita.
  vinculo-vial:
    external: true
